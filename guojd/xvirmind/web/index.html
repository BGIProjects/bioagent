<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>XvirMind · DeepSeek Harness 适配前端</title>
<style>
:root { --ink:#16324f; --text:#2e4355; --muted:#607386; --teal:#087f83; --line:#dce5ec; --wash:#f4f7fa; --pale:#edf8f6; }
* { box-sizing:border-box; }
html,body { height:100%; }
body { margin:0; font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; color:var(--text); background:#fff; display:grid; grid-template-columns:260px 1fr 320px; }
aside, .traj { border-right:1px solid var(--line); padding:20px 16px; overflow:auto; }
.traj { border-right:none; border-left:1px solid var(--line); background:var(--wash); }
.brand { font-weight:700; color:var(--ink); font-size:18px; }
.brand span { color:var(--teal); }
.kicker { font-size:12px; color:var(--muted); margin:6px 0 16px; }
.plugin { border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:10px; background:#fff; }
.plugin h3 { margin:0 0 4px; font-size:14px; color:var(--ink); }
.plugin code { font-size:12px; }
main { display:flex; flex-direction:column; min-width:0; }
header { padding:16px 20px; border-bottom:1px solid var(--line); }
header h1 { margin:0; font-size:18px; color:var(--ink); }
header p { margin:6px 0 0; color:var(--muted); font-size:13px; }
.log { flex:1; overflow:auto; padding:16px 20px; }
.msg { margin:0 0 12px; padding:10px 12px; border-radius:8px; background:var(--wash); white-space:pre-wrap; }
.msg.user { background:var(--pale); }
.composer { padding:12px 16px 16px; border-top:1px solid var(--line); }
textarea { width:100%; min-height:72px; resize:vertical; border:1px solid var(--line); border-radius:8px; padding:8px; font:inherit; }
.row { display:flex; gap:10px; align-items:center; margin-top:8px; flex-wrap:wrap; }
button { background:var(--teal); color:#fff; border:0; border-radius:6px; padding:8px 14px; cursor:pointer; }
button.ghost { background:#fff; color:var(--teal); border:1px solid var(--teal); }
label { font-size:13px; color:var(--muted); }
.ev { font-size:12px; border-bottom:1px solid var(--line); padding:8px 0; }
.ok { color:#157a45; } .bad { color:#b42318; }
@media (max-width: 1100px) { body { grid-template-columns:1fr; } aside,.traj { display:none; } }
</style>
</head>
<body>
<aside>
  <div class="brand">Xvir<span>Mind</span></div>
  <div class="kicker">DeepSeek Harness 架构适配 · 插件即能力</div>
  <div class="plugin">
    <h3>宿主 Host</h3>
    <div id="hostHealth">检测中…</div>
  </div>
  <div class="plugin">
    <h3>taxonomy MCP</h3>
    <code>127.0.0.1:8766</code>
    <div id="taxHealth"></div>
  </div>
  <div class="plugin">
    <h3>annotation MCP</h3>
    <code>127.0.0.1:8767</code>
    <div id="annHealth"></div>
  </div>
  <div class="plugin">
    <h3>本地工具</h3>
    <div id="tools">加载中…</div>
  </div>
</aside>
<main>
  <header>
    <h1>主 Agent 会话</h1>
    <p>前端只负责会话与确认。分类 / 注释走 MCP 插件；完整计算需勾选确认。领域规则不写进 Harness。</p>
  </header>
  <div class="log" id="log"></div>
  <div class="composer">
    <textarea id="box" placeholder="例如：查询 Coronaviridae 的 ICTV 分类标准&#10;或：注释 Flaviviridae 序列 /data/user/wangdaxi/Projects/virus_taxonomy/data/test_genomes/Flaviviridae/KP641127.fna"></textarea>
    <div class="row">
      <button type="button" id="send">发送</button>
      <button type="button" class="ghost" id="cap">列出插件能力</button>
      <label><input type="checkbox" id="confirm" /> 确认计算（仍受 ALLOW_COMPUTE 约束）</label>
    </div>
  </div>
</main>
<section class="traj">
  <div class="kicker">Trajectory · 可审计事件</div>
  <div id="traj"></div>
</section>
<script>
const log = document.getElementById("log");
const traj = document.getElementById("traj");
let sessionId = null;
function add(role, text) {
  const d = document.createElement("div");
  d.className = "msg " + role;
  d.textContent = (role === "user" ? "用户\n" : "主 Agent\n") + text;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
}
function renderEvents(events) {
  traj.innerHTML = "";
  (events || []).slice().reverse().forEach(ev => {
    const d = document.createElement("div");
    d.className = "ev";
    d.textContent = ev.ts + " · " + ev.kind + (ev.name ? " · " + ev.name : "") + (ev.text ? " · " + ev.text.slice(0,80) : "");
    traj.appendChild(d);
  });
}
async function refresh() {
  const h = await (await fetch("/api/health")).json();
  document.getElementById("hostHealth").innerHTML = `<span class="ok">${h.status}</span> · v${h.version}<br>local_only=${h.local_only} · compute=${h.allow_compute}`;
  const tax = h.plugins.taxonomy || {};
  const ann = h.plugins.annotation || {};
  document.getElementById("taxHealth").innerHTML = tax.status === "ok" ? `<span class="ok">ok</span> · ${(tax.tools||[]).length} tools` : `<span class="bad">${tax.error||"down"}</span>`;
  document.getElementById("annHealth").innerHTML = ann.status === "ok" ? `<span class="ok">ok</span> · ${(ann.tools||[]).length} tools` : `<span class="bad">${ann.error||"down"}</span>`;
  const p = await (await fetch("/api/plugins")).json();
  document.getElementById("tools").innerHTML = (p.tools||[]).map(t => `<div><code>${t.name}</code></div>`).join("") || "无";
}
async function send(text) {
  add("user", text);
  const body = { message: text, session_id: sessionId, confirm_compute: document.getElementById("confirm").checked };
  const r = await fetch("/api/chat", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body) });
  const data = await r.json();
  sessionId = data.session_id;
  add("assistant", data.reply);
  renderEvents(data.events);
}
document.getElementById("send").onclick = () => {
  const t = document.getElementById("box").value.trim();
  if (t) { send(t); document.getElementById("box").value=""; }
};
document.getElementById("cap").onclick = () => send("列出分类和注释插件能力");
refresh();
</script>
</body>
</html>
